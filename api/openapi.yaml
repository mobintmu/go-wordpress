openapi: 3.0.3
info:
  title: Product Extraction API
  version: 1.0.0
  description: >-
    Extracts one product from one product page using per-site configuration.
    Each request responds within 3 minutes. Both extraction results return
    HTTP 200, so clients must read the status field.
servers:
  - url: http://127.0.0.1:4000
tags:
  - name: Extraction
  - name: Operations
  - name: Operator
    description: Protected with operator credentials (HTTP Basic).
security:
  - ApiKeyAuth: []
paths:
  /api/v1/extract:
    post:
      tags: [Extraction]
      operationId: extractProduct
      summary: Extract one product from a product page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
            example:
              url: https://badomjip.com/product/example/
              request_id: client-generated-id-123
      responses:
        "200":
          description: Processing ran. Read the status field for the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
              examples:
                success:
                  summary: Product extracted
                  value:
                    status: success
                    request_id: client-generated-id-123
                    url: https://badomjip.com/product/example/
                    site_id: badomjip
                    config_version: "2026-11-08.1"
                    started_at: "2026-11-08T10:00:00Z"
                    finished_at: "2026-11-08T10:00:03Z"
                    duration_ms: 3120
                    product:
                      title: Example product
                      url: https://badomjip.com/product/example/
                      image_url: https://badomjip.com/wp-content/uploads/example.jpg
                      description: "First paragraph.\nSecond paragraph."
                      price:
                        current: 400000
                        regular: 500000
                        currency: IRT
                        raw: 500,000 تومان 400,000 تومان
                        state: available
                    warnings: []
                success_out_of_stock:
                  summary: Product that cannot be ordered
                  value:
                    status: success
                    request_id: client-generated-id-124
                    url: https://badomjip.com/product/sold-out/
                    site_id: badomjip
                    config_version: "2026-11-08.1"
                    started_at: "2026-11-08T10:01:00Z"
                    finished_at: "2026-11-08T10:01:02Z"
                    duration_ms: 2050
                    product:
                      title: Sold out product
                      url: https://badomjip.com/product/sold-out/
                      image_url: https://badomjip.com/wp-content/uploads/sold-out.jpg
                      description: null
                      price:
                        current: null
                        regular: null
                        currency: IRT
                        raw: ""
                        state: out_of_stock
                    warnings:
                      - code: FIELD_MISSING
                        field: description
                        message: The description field was not found on this product page.
                failed_selector:
                  summary: Site layout changed
                  value:
                    status: failed
                    request_id: client-generated-id-123
                    url: https://badomjip.com/product/example/
                    site_id: badomjip
                    config_version: "2026-11-08.1"
                    duration_ms: 2140
                    error:
                      code: SELECTOR_NOT_FOUND
                      stage: extract
                      owner: site_config
                      retryable: false
                      confidence: high
                      message: The product block was not found on the page.
                      root_cause: The page returned HTTP 200 with real content, but selector 'div.product.type-product' matched 0 elements. The site markup has probably changed.
                      suggested_action: Update pages.product.root in configs/sites/badomjip.com.json.
                    evidence:
                      failed_url: https://badomjip.com/product/example/
                      final_url: https://badomjip.com/product/example/
                      redirects: []
                      http_status: 200
                      attempts: 1
                      content_type: text/html; charset=UTF-8
                      body_bytes: 184233
                      body_sha256: 9f2c0d7ab1
                      page_title: Example product - Badomjip
                      selector_trace:
                        - selector: div.main-page-wrapper
                          matches: 1
                        - selector: div.main-page-wrapper div.site-content
                          matches: 1
                        - selector: div.product.type-product
                          matches: 0
                      html_sample:
                        reason: Deepest element matched by the failing selector path
                        content: <div class="site-content"><article class="new-product">...</article></div>
                        truncated: true
                        original_length: 48211
                    partial:
                      product: null
                failed_blocked:
                  summary: Target site blocked the request
                  value:
                    status: failed
                    request_id: client-generated-id-456
                    url: https://hosseinibrothers.ir/example-product.html
                    site_id: hosseinibrothers
                    config_version: "2026-11-08.1"
                    duration_ms: 1120
                    error:
                      code: BOT_PROTECTION
                      stage: page_check
                      owner: source_site
                      retryable: false
                      confidence: high
                      message: The target site returned an anti-bot challenge.
                      root_cause: The response had HTTP 403 and a cf-mitigated header, so the product page was never served.
                      suggested_action: Ask the site owner for access or review the site's fetch settings.
                    evidence:
                      failed_url: https://hosseinibrothers.ir/example-product.html
                      final_url: https://hosseinibrothers.ir/example-product.html
                      redirects: []
                      http_status: 403
                      attempts: 1
                      content_type: text/html; charset=UTF-8
                      body_bytes: 7342
                      body_sha256: 41bc7e09d2
                      page_title: Just a moment...
                      response_headers:
                        server: cloudflare
                        cf-mitigated: challenge
                      html_sample:
                        reason: Start of the response body
                        content: <!DOCTYPE html><html><head><title>Just a moment...</title>
                        truncated: true
                        original_length: 7342
                    partial:
                      product: null
        "400":
          description: The body is not valid JSON or exceeds 1 MiB, url is missing, or url is malformed or not http or https.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_url:
                  summary: url is missing
                  value:
                    code: INVALID_REQUEST
                    message: The url field is required.
                invalid_url:
                  summary: url is malformed
                  value:
                    code: INVALID_URL
                    message: The url must be an absolute http or https URL.
        "401":
          description: The API key is missing, unknown, revoked, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: UNAUTHORIZED
                message: Invalid API key.
        "429":
          description: No capacity is available. Retry after the given delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                site_busy:
                  summary: Another extraction for this site is running
                  value:
                    code: TOO_MANY_REQUESTS
                    message: This site already has a running extraction.
                capacity:
                  summary: The instance is at capacity
                  value:
                    code: TOO_MANY_REQUESTS
                    message: This instance is at capacity.
        "503":
          description: This instance is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: SHUTTING_DOWN
                message: This instance is shutting down.
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Check that the process is running
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                message: OK
  /ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Check that this instance accepts new requests
      security: []
      responses:
        "200":
          description: The instance accepts new requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                message: OK
        "503":
          description: The instance is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: SHUTTING_DOWN
                message: This instance is shutting down.
  /openapi.yaml:
    get:
      tags: [Operator]
      operationId: getOpenAPI
      summary: This contract
      security:
        - OpsBasicAuth: []
      responses:
        "200":
          description: The OpenAPI file.
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/OpsUnauthorized"
        "404":
          description: Operator endpoints are turned off (APP_OPS_USER or APP_OPS_PASSWORD_HASH is unset).
  /metrics:
    get:
      tags: [Operator]
      operationId: getMetrics
      summary: Prometheus metrics
      security:
        - OpsBasicAuth: []
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/OpsUnauthorized"
        "404":
          description: Operator endpoints are turned off.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OpsBasicAuth:
      type: http
      scheme: basic
  responses:
    OpsUnauthorized:
      description: Operator credentials are missing or wrong.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: UNAUTHORIZED
            message: Operator credentials are required.
  schemas:
    ExtractRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: One product page, on a domain with a site config.
        request_id:
          type: string
          description: Echoed in the response and logs. Generated if missing.
    ExtractResponse:
      type: object
      required: [status, request_id, url, duration_ms]
      properties:
        status:
          type: string
          enum: [success, failed]
        request_id:
          type: string
        url:
          type: string
          format: uri
        site_id:
          type: string
          description: Missing when no site config matched.
        config_version:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
        product:
          $ref: "#/components/schemas/Product"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        error:
          $ref: "#/components/schemas/ExtractError"
        evidence:
          $ref: "#/components/schemas/Evidence"
        partial:
          $ref: "#/components/schemas/Partial"
    Product:
      type: object
      required: [url]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
          description: Canonical URL when it is on the site's domains, otherwise the final URL.
        image_url:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          nullable: true
        price:
          $ref: "#/components/schemas/Price"
    Price:
      type: object
      required: [state]
      properties:
        current:
          type: integer
          format: int64
          nullable: true
          description: Price in toman. The lowest price when the page shows a range. Null when no price is available, never 0.
        regular:
          type: integer
          format: int64
          nullable: true
          description: Regular price in toman, before any sale. The lowest value when the page shows a range.
        currency:
          type: string
          enum: [IRT]
          description: Always IRT, meaning toman.
        raw:
          type: string
          description: Text as it appeared on the page.
        state:
          type: string
          enum: [available, call_for_price, out_of_stock, unknown]
          description: out_of_stock means the product cannot be ordered.
    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
    ExtractError:
      type: object
      required: [code, stage, owner, retryable, confidence, message, root_cause]
      properties:
        code:
          type: string
          description: >-
            Failure code. New codes can be added over time, so treat unknown
            codes like INTERNAL_ERROR. Known codes: SITE_NOT_CONFIGURED,
            SITE_DISABLED, CONFIG_INVALID, NOT_PRODUCT_URL, URL_NOT_ALLOWED,
            DNS_FAILED, CONNECTION_FAILED, TLS_FAILED, FETCH_TIMEOUT,
            HTTP_NOT_FOUND, ACCESS_DENIED, RATE_LIMITED, SOURCE_SERVER_ERROR,
            HTTP_ERROR, ROBOTS_DISALLOWED, REDIRECT_NOT_ALLOWED,
            TOO_MANY_REDIRECTS, UNSUPPORTED_CONTENT, RESPONSE_TOO_LARGE,
            BOT_PROTECTION, JS_RENDERED_PAGE, EMPTY_PAGE, SELECTOR_NOT_FOUND,
            REQUIRED_FIELD_MISSING, PRICE_PARSE_FAILED, DEADLINE_EXCEEDED,
            INTERNAL_ERROR.
        stage:
          type: string
          enum: [config, fetch, page_check, extract, normalize, validate]
        owner:
          type: string
          enum: [client, site_config, source_site, service]
        retryable:
          type: boolean
        confidence:
          type: string
          enum: [high, medium]
        message:
          type: string
        root_cause:
          type: string
        suggested_action:
          type: string
    Evidence:
      type: object
      properties:
        failed_url:
          type: string
          format: uri
        final_url:
          type: string
          format: uri
        redirects:
          type: array
          items:
            type: string
        http_status:
          type: integer
        attempts:
          type: integer
        content_type:
          type: string
        body_bytes:
          type: integer
          format: int64
        body_sha256:
          type: string
        page_title:
          type: string
        response_headers:
          type: object
          additionalProperties:
            type: string
        selector_trace:
          type: array
          items:
            $ref: "#/components/schemas/SelectorTraceStep"
        html_sample:
          $ref: "#/components/schemas/HtmlSample"
        field_samples:
          type: object
          description: Raw text found for each field.
          additionalProperties:
            type: string
    SelectorTraceStep:
      type: object
      required: [selector, matches]
      properties:
        selector:
          type: string
        matches:
          type: integer
    HtmlSample:
      type: object
      required: [reason, content, truncated]
      properties:
        reason:
          type: string
        content:
          type: string
          description: Untrusted third-party HTML. Escape before displaying.
        truncated:
          type: boolean
        original_length:
          type: integer
    Partial:
      type: object
      required: [product]
      properties:
        product:
          allOf:
            - $ref: "#/components/schemas/Product"
          nullable: true
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
